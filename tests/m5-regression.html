<!doctype html>
<meta charset="utf-8">
<title>FlattenCT M5 parser regression</title>
<pre id="output">Running...</pre>
<iframe id="app" src="../index.html?v=10" hidden></iframe>
<script>
  const output = document.getElementById("output");
  const app = document.getElementById("app");
  const report = "../10505643_0100_Confidence%20Test_EWR-M5_07_17_2025%2008_32_20%20AM.html";

  app.addEventListener("load", async () => {
    try {
      const html = await fetch(report).then((response) => response.text());
      const row = app.contentWindow.FlattenCT.parseHtml("m5.html", html);
      const expected = {
        "Transmitter Linearity Test_VoltageLinearityBias (mV)": "48636.00 H",
        "Transmitter Linearity Test_VoltageLinearitySlope (mV_mV)": "0.00 L",
        "Transmitter Linearity Test_VoltageLinearityR-Squared": "NaN Failed",
        "Transmitter Linearity Test_CurrentLinearityBias (mA)": "0.00",
        "Transmitter Linearity Test_CurrentLinearitySlope (mA_mV)": "0.00",
        "Transmitter Linearity Test_CurrentLinearityR-Squared": "NaN Failed"
      };
      for (const [key, value] of Object.entries(expected)) {
        if (row[key] !== value) throw new Error(`Expected ${key}=${value}, got ${row[key] ?? "(missing)"}`);
      }
      const lowGainFixture = `
        <table>
          <tr><td class="v9navy">Low Gain Measurements</td></tr>
          <tr><td class="v9navy">250 kHz Transmitter Frequency</td></tr>
          <tr><td class="v9navy">Spacing</td><td class="v9navy">Low Limit</td><td class="v9navy">Phase Shift(deg)</td><td class="v9navy">High Limit</td><td class="v9navy">Low Limit</td><td class="v9navy">Attenuation(dB)</td><td class="v9navy">High Limit</td></tr>
          <tr><td><table><tr><td>8-inch LT</td><td></td><td>5.84</td><td></td><td></td><td>10.22</td><td></td></tr></table></td></tr>
        </table>`;
      const lowGain = app.contentWindow.FlattenCT.parseHtml("low-gain.html", lowGainFixture);
      if (lowGain["LowGain_250kHz_8-inch LT_Phase Shift(deg)"] !== "5.84" ||
          lowGain["LowGain_250kHz_8-inch LT_Attenuation(dB)"] !== "10.22") {
        throw new Error("Low Gain two-measurement row was not split into Phase Shift and Attenuation");
      }
      const gainRows = ["8-inch LT", "8-inch UT", "8-inch Comp", ...Array.from({ length: 6 }, (_, index) => `${16 + index * 8}-inch LT`), ...Array.from({ length: 8 }, (_, index) => `${16 + index * 8}-inch UT`)].slice(0, 17);
      const airRows = ["8", "16", "24", "32", "40", "48", "56"];
      const gainTables = ["Low Gain", "High Gain"].flatMap((gain) => ["250", "500", "2MHz"].map((frequency) => `
        <table><tr><td class="v9navy">${gain} Measurements</td></tr><tr><td class="v9navy">${frequency === "2MHz" ? "2 MHz" : frequency + " kHz"} Transmitter Frequency</td></tr>
        <tr><td class="v9navy">Spacing</td><td class="v9navy">Low Limit</td><td class="v9navy">Phase Shift(deg)</td><td class="v9navy">High Limit</td><td class="v9navy">Low Limit</td><td class="v9navy">Attenuation(dB)</td><td class="v9navy">High Limit</td></tr>
        <tr><td><table>${gainRows.map((spacing, index) => `<tr><td>${spacing}</td><td></td><td>${index}.1</td><td></td><td></td><td>${index}.2</td><td></td></tr>`).join("")}</table></td></tr></table>`));
      const airTables = ["Low Gain", "High Gain"].flatMap((gain) => ["250", "500", "2MHz"].map((frequency) => `
        <table><tr><td>${gain} Measurements</td></tr><tr><td>${frequency === "2MHz" ? "2 MHz" : frequency + " kHz"} Transmitter Frequency</td></tr>
        <tr><td>Spacing(in.)</td><td>UT PS(deg)</td><td>UT Atten.(dB)</td><td>LT PS(deg)</td><td>LT Atten.(dB)</td></tr>
        <tr><td><table>${airRows.map((spacing, index) => `<tr><td>${spacing}</td><td>${index}.1</td><td>${index}.2</td><td>${index}.3</td><td>${index}.4</td></tr>`).join("")}</table></td></tr></table>`));
      const generated = app.contentWindow.FlattenCT.parseHtml("m5-all-sections.html", gainTables.join("") + airTables.join(""));
      const gainColumns = Object.keys(generated).filter((key) => /^(LowGain|HighGain)_/.test(key));
      const airColumns = Object.keys(generated).filter((key) => /^AirHang_/.test(key));
      if (gainColumns.length !== 204 || airColumns.length !== 168) {
        throw new Error(`Expected 204 gain and 168 Air-Hang columns, got ${gainColumns.length} and ${airColumns.length}`);
      }
      if (generated["LowGain_250kHz_8-inch LT_Phase Shift(deg)"] !== "0.1" ||
          generated["LowGain_250kHz_8-inch LT_Attenuation(dB)"] !== "0.2" ||
          generated["AirHang_HighGain_2MHz_56_LT Atten.(dB)"] !== "6.4") {
        throw new Error("Gain or Air-Hang frequency/spacing mapping is incorrect");
      }
      if (Object.keys(row).some((key) => /_(Low|High)Limit$/i.test(key))) throw new Error("Limit columns were exported");
      output.textContent = "PASS: M5 nested Actual Reading values parsed, including blank-unit rows.";
    } catch (error) {
      output.textContent = `FAIL: ${error.message}`;
      document.body.dataset.testFailed = "true";
    }
  });
</script>
